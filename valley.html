<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Karnak Temple</title>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo">

        <ul>
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="story.html" data-i18n="nav.stories">Stories</a>
            <a href="badges.html" data-i18n="nav.badges">Badges</a>
            <a href="parents.html" data-i18n="nav.parents">Parents</a>
        </ul>
        <button data-i18n="btn.login" id="login-btn">Log In</button>
        <section class="account" id="account" style="display: none;">
            <button onclick="window.location.href='account.html'" style="background-color: transparent; width: 2rem; height: 2rem;">
                <img src="pfp.png" alt="pfp" style="width: 2rem; height: 2rem; border-radius: 50%;">
            </button>
            </section>
    </header>

    <main>
        <section id="main">
            <form action="" id="loginBox" class="login-div">
                <div>
                    <label for="role">Who are you?</label>
                    <select style="color: var(--Brown);" name="role" id="role">
                        <option style="color: var(--Brown);" value="parent">Parent</option>
                        <option style="color: var(--Brown);" value="child">Child</option>
                    </select>
                </div>
    
                <div>
                    <label for="fname">First Name</label>
                    <input id="fname" type="text" placeholder="Enter your first name...">
                </div>
    
                <div>
                    <label for="lname">Last Name</label>
                    <input id="lname" type="text" placeholder="Enter your last name...">
                </div>
    
                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="example@gmail.com">
                </div>
                <div>
                    <label for="age">Age</label>
                    <input type="number" name="age" id="age" placeholder="18">
                </div>
    
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password">
                </div>
    
                <div class="buttons" style="flex-direction: row-reverse;">
                    <button id="submit" class="submit">Log In</button>
                    <button id="cancel" class="cancel">Cancel</button>
                </div>
            </form>
        </section>


        <section class="hero-sec">
            <div class="hero-txt">
                <h1 data-i18n="hero.title">Valley Of The Kings</h1>
                <p data-i18n="hero.desc">Explore the hidden tombs of Egypt's greatest pharaohs and their treasures.</p>
            </div>
        </section>

        <section class="img-sec">
            <img src="valley-kings.png" alt="valley of the kings">
            <img src="valley-kings1.png" alt="valley of the kings">
            <img src="valley-kings2.png" alt="valley of the kings">
            <img src="valley-kings3.png" alt="valley of the kings">
            <img src="valley-kings4.png" alt="valley of the kings">
            <img src="valley-kings5.png" alt="valley of the kings">
        </section>
    </main>
</body>
</html>
