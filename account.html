<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
    <style>
        body{
            background-color: #E9E6DA;
        }

        header{
            display: flex;
            gap: 2rem;
            align-items: center;
            border: 2px solid #C9B08A;
            border-radius: 2rem;
            padding: 1rem;
        }

        img{
            width: 10vw;
            height: 20vh;
            border-radius: 50%;
        }

        main{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            padding: 2rem;
        }

        main div{
            border: 2px solid #C9B08A;
            padding: 1rem;
            border-radius: 2rem;
        }
    </style>
    <title>Account</title>
</head>

<body>
    <header>
        <img src="pfp.png" alt="pfp">
        <h1 id="full-name"></h1>
    </header>

    <main>
        <div>
            <small>First Name</small>
            <p id="first"></p>
        </div>

        <div>
            <small>Last Name</small>
            <p id="last"></p>
        </div>

        <div>
            <small>Email</small>
            <p id="email"></p>
        </div>

        <div>
            <small>Age</small>
            <p id="age"></p>
        </div>

        <div>
            <small>Password</small>
            <p>********</p>
        </div>
    </main>

    <script>
        window.addEventListener("load", (e) => {
            e.preventDefault()
            const fullName = document.getElementById("full-name");
            const firstName = document.getElementById("first");
            const lastName = document.getElementById("last");
            const email = document.getElementById("email");
            const age = document.getElementById("age");
            const storedData = JSON.parse(localStorage.getItem("userInfo"));

            
            if (storedData) {
                fullName.textContent = `${storedData.fName} ${storedData.lName}`;
                firstName.textContent = `${storedData.fName}`;
                lastName.textContent = `${storedData.lName}`;
                email.textContent = `${storedData.mail}`;
                age.textContent = `${storedData.age}`
            }
        })
    </script>
</body>
</html>
